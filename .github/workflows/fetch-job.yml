# 임시: 드라이브의 job.json을 릴리스 자산으로 복사 (로컬 렌더 테스트용)
name: fetch-job
on:
  workflow_dispatch:
    inputs:
      file_id: { required: true, type: string }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL --fail -o "job_${{ inputs.file_id }}.json" "https://drive.google.com/uc?export=download&id=${{ inputs.file_id }}"
          head -c 100 "job_${{ inputs.file_id }}.json"
          gh release upload renders "job_${{ inputs.file_id }}.json" --clobber
